name: Atualizar dados de mercado

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 08h30 em Brasília
    - cron: "30 22 * * 1-5"   # 19h30 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-mercado
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar dados oficiais
        run: python scripts/atualizar_mercado.py
      - name: Publicar se mudou
        run: |
          if git diff --quiet -- data/mercado.json; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mercado.json
          git commit -m "Atualiza dados de mercado"
          git push
